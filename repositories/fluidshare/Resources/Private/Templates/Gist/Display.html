{namespace v=FluidTYPO3\Vhs\ViewHelpers}
<f:layout name="Default" />

<f:section name="Main">
	<article class="library-detail">
		<a href="{f:uri.page(pageUid: 6)}" class="library-back-link" data-history-back>
			<span aria-hidden="true">&larr;</span>
			Back to all examples
		</a>
		<section class="library-detail-section" aria-labelledby="library-example-details">
			<header class="mb-4">
				<p class="library-eyebrow mb-2">Code example</p>
				<h2 class="library-detail-title">{gist.title}</h2>
				<div class="library-detail-summary">
					<f:format.html>{gist.summary}</f:format.html>
				</div>
			</header>
			<f:render partial="GistMeta" arguments="{_all}" />
		</section>
		<section class="library-detail-code-section" aria-label="Code">
			<div class="library-gist-embed">
				<f:format.raw>{response.json.div}</f:format.raw>
			</div>
		</section>
	</article>
</f:section>
