{namespace v=FluidTYPO3\Vhs\ViewHelpers}
<f:layout name="Default" />

<f:section name="Main">

	<div class="row">
		<aside class="col-12 col-lg-4 col-xxxl-3 mb-4 mb-lg-0" aria-label="Library share">
			<div class="library-confirmation">
				<p class="library-eyebrow mb-2">Final check</p>
				<h2 class="h3 mb-2">Review your submission</h2>
				<p class="mb-4 text-body-secondary">
					Confirm the metadata and preview below before sending the example for review.
				</p>
			</div>
		</aside>
		<div class="col-12 col-lg-8 col-xxxl-9 library-form">
			<div class="library-confirmation">
				<h2 class="h3 mb-4">Your submission</h2>
				<div class="library-detail-summary">
					{gist.summary -> f:format.html()}
				</div>
				<section class="library-detail-section" aria-labelledby="library-confirm-metadata">
					<h3 id="library-confirm-metadata" class="h5 mb-3"><v:l>text.metadata</v:l></h3>
					<f:render partial="GistMeta" arguments="{_all}" />
				</section>
				<section class="library-detail-section" aria-labelledby="library-confirm-preview">
					<h3 id="library-confirm-preview" class="h5 mb-3"><v:l>text.preview</v:l></h3>
					<div class="library-gist-embed">
						{response.json.div -> f:format.raw()}
					</div>
				</section>
				<f:form action="create" name="gist" object="{gist}" method="post" class="library-form-actions">
					<f:form.hidden property="url" value="{gist.url}" />
					<f:form.hidden property="summary" value="{gist.summary}" />
					<f:form.hidden property="title" value="{gist.title}" />
					<f:for each="{gist.tags}" as="tag" iteration="iterator">
						<f:form.hidden property="tags.{iterator.index}" value="{tag.uid}" />
					</f:for>
					<f:for each="{gist.extensions}" as="extension" iteration="iterator">
						<f:form.hidden property="extensions.{iterator.index}" value="{extension.uid}" />
					</f:for>
					<button type="submit" class="btn btn-success btn-lg">
						<v:l>button.submit</v:l>
					</button>
				</f:form>
			</div>
		</div>
	</div>
</f:section>
