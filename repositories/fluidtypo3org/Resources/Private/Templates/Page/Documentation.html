<f:layout name="Page" />

<f:section name="Configuration">
    <flux:form id="documentation-fluidtypo3org" label="Documentation" />
    <flux:grid>
        <flux:grid.row>
            <flux:grid.column colPos="1" label="Documentation navigation" />
            <flux:grid.column colPos="0" label="Documentation body" />
        </flux:grid.row>
    </flux:grid>
</f:section>

<f:section name="Header">
    <f:render partial="Page/PrimaryNavigation" />
</f:section>

<f:section name="SubNavigation">
    <nav class="site-subnavigation" aria-label="Documentation areas">
        <ul class="nav flex-nowrap">
            <v:menu pageUid="3" as="menu">
                <f:for each="{menu}" as="item">
                    <li class="nav-item">
                        <a href="{item.link}" class="nav-link {item.class}">
                            {item.linktext}
                        </a>
                    </li>
                </f:for>
            </v:menu>
        </ul>
    </nav>
</f:section>

<f:section name="Main">
    {v:content.render(column: 1) | f:format.trim() | f:variable(name: 'content1')}
    {v:content.render(column: 0) | f:format.trim() | f:variable(name: 'content2')}
    <div class="row gx-lg-5">
        <f:if condition="{content1}">
            <f:then>
                <aside class="col-12 col-lg-4 col-xxxl-3 mb-4 mb-lg-0" aria-label="Documentation navigation">
                    {content1 | f:format.raw()}
                </aside>
                <div class="col-12 col-lg-8 col-xxxl-9">
                    {content2 | f:format.raw()}
                </div>
            </f:then>
            <f:else>
                {content2 | f:format.raw()}
            </f:else>
        </f:if>
    </div>
</f:section>
